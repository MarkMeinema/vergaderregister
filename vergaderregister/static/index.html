<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vergaderregister</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231D5C86'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <aside class="zijbalk">
    <a class="merk" href="#/">
      <span class="merk-teken" aria-hidden="true"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7"/><path d="M9 11h14M9 16h14M9 21h9"/></svg></span>
      <span><b>Vergaderregister</b><small>UWV · fictieve demodata</small></span>
    </a>
    <nav class="hoofdnav" id="hoofdnav" aria-label="Hoofdmenu"></nav>
    <div class="zijbalk-voet">
      <label for="gebruiker" class="label-klein">Ik ben</label>
      <select id="gebruiker"></select>
      <a class="link-klein" href="export/alles.json">Alles exporteren (JSON)</a>
    </div>
  </aside>
  <div class="kolom">
    <header class="topbalk">
      <form id="snelzoek" class="snelzoek" role="search">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="snelzoek-q" type="search" placeholder="Zoek in besluiten, acties, verslagen en bijlagen…" autocomplete="off" aria-label="Zoeken">
        <kbd>/</kbd>
      </form>
      <button class="knop primair" data-actie="nieuwe-vergadering"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Nieuwe vergadering</span></button>
    </header>
    <main id="main" tabindex="-1"><div class="laden">Laden…</div></main>
  </div>
</div>
<div id="modal-laag" class="modal-laag" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js"></script>
</body>
</html>
